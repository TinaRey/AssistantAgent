[project]
name = "pantalelle-assistant-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "openai>=3.57.0",
  "python-pptx>=1.0.2",
  "sqlalchemy>=2.1.9",
  "psycopg[binary]>=3.3.9",
  "pgvector>=0.5.1",
  "alembic>=1.20.1",
  "pypdf>=7.1.1",
  "python-docx>=1.2.0",
  "python-multipart>=0.0.34",
  "httpx>=0.28.1",
  "reportlab>=5.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008", "ISC004"]
